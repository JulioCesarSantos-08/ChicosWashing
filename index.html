<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" type="image/png" href="imagenes/logo1.png" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Crear Recibos - Chicos Washing</title>

    <link rel="stylesheet" href="styles.css">

    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.11.0/firebase-database-compat.js"></script>
</head>
<body>

<div class="container">
    <h3>Datos del Recibo</h3>

    <p id="ultimoFolio" class="ultimo-folio"></p>

    <label>Lavandería:</label>
    <select id="lavanderia">
        <option value="Lavandería 1">Lavandería 1</option>
        <option value="Lavandería 2">Lavandería 2</option>
    </select>

    <label>Nombre del Cliente:</label>
    <input type="text" id="cliente" required>

    <label>Kilos de ropa (lavado normal):</label>
    <input type="number" id="kilos" min="0" required>

    <label>Folio:</label>
    <input type="text" id="folio" required>

    <label>Fecha de ingreso:</label>
    <input type="date" id="fechaIngreso" required>

    <label>Total a pagar:</label>
    <input type="number" id="total" readonly>

    <label>Fecha de entrega:</label>
    <input type="date" id="fechaEntrega" required>

    <label>Hora de entrega:</label>
    <input type="time" id="horaEntrega">

    <hr>

    <!-- ================= LISTA 1 ================= -->
    <details open>
        <summary><strong>🧺 Ropa normal (se cobra por kilo)</strong></summary>

        <div class="ropa-formulario">
            <label>👕 Playeras:</label><input type="number" id="playeras" min="0" value="0">
            <label>👖 Pantalones:</label><input type="number" id="pantalones" min="0" value="0">
            <label>🩳 Shorts:</label><input type="number" id="shorts" min="0" value="0">
            <label>👔 Camisas:</label><input type="number" id="camisas" min="0" value="0">
            <label>🧥 Suéter:</label><input type="number" id="abrigos" min="0" value="0">
            <label>🧦 Calcetines:</label><input type="number" id="calcetines" min="0" value="0">
            <label>👗 Vestidos:</label><input type="number" id="vestidos" min="0" value="0">
            <label>🛁 Toallas:</label><input type="number" id="toallas" min="0" value="0">
            <label>🛏️ Sábanas:</label><input type="number" id="sabanas" min="0" value="0">
            <label>👚 Blusas:</label><input type="number" id="blusas" min="0" value="0">
            <label>👕 Camisetas:</label><input type="number" id="camisetas" min="0" value="0">
            <label>👒 Faldas:</label><input type="number" id="faldas" min="0" value="0">
            <label>🦺 Chalecos:</label><input type="number" id="chalecos" min="0" value="0">
            <label>🎒 Mochilas:</label><input type="number" id="mochilas" min="0" value="0">
            <label>🩲 Boxers:</label><input type="number" id="boxers" min="0" value="0">
        </div>
    </details>

    <hr>

    <!-- ================= LISTA 2 ================= -->
    <details>
        <summary><strong>👔 Tintorería (precio por prenda)</strong></summary>

        <div class="ropa-formulario">
            <label>Saco:</label><input type="number" class="tintoreria" data-precio="75" value="0">
            <label>Pantalón de vestir:</label><input type="number" class="tintoreria" data-precio="55" value="0">
            <label>Falda:</label><input type="number" class="tintoreria" data-precio="45" value="0">
            <label>Chamarra piel:</label><input type="number" class="tintoreria" data-precio="150" value="0">
            <label>Chamarra pluma:</label><input type="number" class="tintoreria" data-precio="95" value="0">
            <label>Chamarra tacto piel:</label><input type="number" class="tintoreria" data-precio="95" value="0">
            <label>Sueter:</label><input type="number" class="tintoreria" data-precio="65" value="0">
            <label>Camisa:</label><input type="number" class="tintoreria" data-precio="48" value="0">
        </div>
    </details>

    <hr>

    <!-- ================= LISTA 3 ================= -->
    <details>
        <summary><strong>🛏️ Artículos especiales</strong></summary>

        <div class="ropa-formulario">
            <label>Tenis (Par):</label><input type="number" class="especiales" data-precio="70" value="0">
            <label>Edredon chi individual:</label><input type="number" class="especiales" data-precio="80" value="0">
            <label>Edredon Matrimonial:</label><input type="number" class="especiales" data-precio="90" value="0">
            <label>Edredon Queen:</label><input type="number" class="especiales" data-precio="100" value="0">
            <label>Edredon kinsize:</label><input type="number" class="especiales" data-precio="110" value="0">
            <label>🧢 Gorras:</label><input type="number" class="especiales" data-precio="50" value="0">
            <label>Maleta 1:</label><input type="number" class="especiales" data-precio="40" value="0">
            <label>Maleta 2:</label><input type="number" class="especiales" data-precio="60" value="0">
            <label>Maleta 3:</label><input type="number" class="especiales" data-precio="90" value="0">
            <label>Toalla Grande:</label><input type="number" class="especiales" data-precio="20" value="0">
            <label>Juego de Sabanas:</label><input type="number" class="especiales" data-precio="40" value="0">
            <label>Chamarra algodon doble vista pluma:</label><input type="number" class="especiales" data-precio="100" value="0">
        </div>
    </details>

    <hr>

    <label>Descripción manual (opcional):</label>
    <textarea id="descripcionManual" rows="3"></textarea>

    <label>Estado:</label>
    <select id="estado">
        <option value="pendiente">Pendiente</option>
        <option value="pagado">Pagado</option>
    </select>

    <label>Método de pago:</label>
    <select id="metodoPago">
        <option value="efectivo">Efectivo</option>
        <option value="transferencia">Transferencia</option>
    </select>

    <button onclick="generarRecibo()">Generar Recibo</button>
    <button onclick="window.location.href='datos.html'">Ver Datos</button>
</div>

<div id="recibo" class="hidden"></div>

<div id="accionesRecibo" class="hidden" style="margin-bottom: 30px;">
    <button onclick="compartirRecibo()">📤 Compartir recibo</button>
</div>

<!-- Scripts -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="script.js"></script>
<script src="script2.js"></script>

</body>
</html>
